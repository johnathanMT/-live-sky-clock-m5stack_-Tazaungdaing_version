<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Tazaungdaing — Festival of Lights</title>
  <desc id="d">Fire balloons rise past a full moon above a golden pagoda while oil lamps flicker below.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1033"/>
      <stop offset="0.7" stop-color="#26285e"/>
      <stop offset="1" stop-color="#5a3a6a"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0.55" stop-color="#fff6d8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameGlow">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="0.55" stop-color="#e0b030"/>
      <stop offset="1" stop-color="#a87a10"/>
    </linearGradient>

    <!-- one paper fire balloon, drawn around (0,0) -->
    <g id="balloon">
      <circle cx="0" cy="6" r="22" fill="url(#flameGlow)" class="glow"/>
      <path d="M-11,0 C-14,-16 14,-16 11,0 C9,8 5,12 3,14 L-3,14 C-5,12 -9,8 -11,0 Z"/>
      <path d="M-4,-11 C-6,-2 -5,8 -3,14 M4,-11 C6,-2 5,8 3,14" stroke="#000" stroke-opacity="0.18" fill="none"/>
      <ellipse cx="0" cy="16" rx="2.2" ry="3.2" fill="#fff3a0" class="flame"/>
    </g>
  </defs>

  <style>
    .rise   { animation: rise linear infinite; }
    .sway   { animation: sway 4s ease-in-out infinite alternate; }
    .twinkle{ animation: twinkle 3s ease-in-out infinite; }
    .flame  { animation: flicker 0.35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
    .glow   { animation: pulse 1.6s ease-in-out infinite alternate; }
    @keyframes rise    { from { transform: translateY(330px); } to { transform: translateY(-60px); } }
    @keyframes sway    { from { transform: translateX(-10px); } to { transform: translateX(12px); } }
    @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes flicker { from { transform: scaleY(0.75); opacity: 0.8; } to { transform: scaleY(1.2); opacity: 1; } }
    @keyframes pulse   { from { opacity: 0.55; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="40"  cy="30"  r="1.3"/>
    <circle class="twinkle" cx="130" cy="70"  r="1"   style="animation-delay:-1s"/>
    <circle class="twinkle" cx="210" cy="22"  r="1.4" style="animation-delay:-2s"/>
    <circle class="twinkle" cx="330" cy="55"  r="1"   style="animation-delay:-0.5s"/>
    <circle class="twinkle" cx="470" cy="18"  r="1.2" style="animation-delay:-1.7s"/>
    <circle class="twinkle" cx="560" cy="80"  r="1"   style="animation-delay:-2.4s"/>
    <circle class="twinkle" cx="700" cy="40"  r="1.4" style="animation-delay:-0.9s"/>
    <circle class="twinkle" cx="770" cy="95"  r="1"   style="animation-delay:-1.3s"/>
    <circle class="twinkle" cx="90"  cy="130" r="0.9" style="animation-delay:-2.1s"/>
    <circle class="twinkle" cx="400" cy="110" r="0.9" style="animation-delay:-0.3s"/>
  </g>

  <!-- full moon of Tazaungmon -->
  <circle cx="640" cy="70" r="60" fill="url(#moonGlow)"/>
  <circle cx="640" cy="70" r="28" fill="#fbf2d2"/>
  <circle cx="631" cy="63" r="5" fill="#e9dcb4"/>
  <circle cx="650" cy="80" r="3.5" fill="#e9dcb4"/>

  <!-- distant hills -->
  <path d="M0,240 L90,200 L190,232 L300,190 L420,228 L540,196 L660,226 L800,192 L800,300 L0,300 Z" fill="#1d2150"/>

  <!-- fire balloons (behind the pagoda) -->
  <g transform="translate(120,0)"><g class="rise" style="animation-duration:14s;animation-delay:-3s"><g class="sway"><use href="#balloon" fill="#ff4a2a"/></g></g></g>
  <g transform="translate(250,0)"><g class="rise" style="animation-duration:18s;animation-delay:-11s"><g class="sway" style="animation-delay:-1.5s"><use href="#balloon" fill="#ff9a2e" transform="scale(0.8)"/></g></g></g>
  <g transform="translate(340,0)"><g class="rise" style="animation-duration:12s;animation-delay:-7s"><g class="sway" style="animation-delay:-3s"><use href="#balloon" fill="#ffdd55"/></g></g></g>
  <g transform="translate(470,0)"><g class="rise" style="animation-duration:16s;animation-delay:-1s"><g class="sway" style="animation-delay:-2s"><use href="#balloon" fill="#ff4a2a" transform="scale(0.7)"/></g></g></g>
  <g transform="translate(560,0)"><g class="rise" style="animation-duration:13s;animation-delay:-9s"><g class="sway"><use href="#balloon" fill="#ff9a2e" transform="scale(1.1)"/></g></g></g>
  <g transform="translate(720,0)"><g class="rise" style="animation-duration:17s;animation-delay:-5s"><g class="sway" style="animation-delay:-0.7s"><use href="#balloon" fill="#ffdd55" transform="scale(0.85)"/></g></g></g>
  <g transform="translate(60,0)"><g class="rise" style="animation-duration:19s;animation-delay:-14s"><g class="sway" style="animation-delay:-2.6s"><use href="#balloon" fill="#ff9a2e" transform="scale(0.65)"/></g></g></g>

  <!-- golden pagoda -->
  <g transform="translate(400,0)">
    <path d="M-70,262 L70,262 L60,250 L-60,250 Z" fill="#a87a10"/>
    <path d="M-55,250 L55,250 L46,238 L-46,238 Z" fill="url(#gold)"/>
    <path d="M-40,238 C-40,200 -18,180 -12,168 L12,168 C18,180 40,200 40,238 Z" fill="url(#gold)"/>
    <rect x="-14" y="160" width="28" height="8" fill="#a87a10"/>
    <rect x="-11" y="153" width="22" height="7" fill="#ffd54a"/>
    <path d="M-9,153 C-7,135 -3,118 0,96 C3,118 7,135 9,153 Z" fill="url(#gold)"/>
    <rect x="-5" y="98" width="10" height="2" fill="#a87a10"/>
    <rect x="-3.5" y="94" width="7" height="2" fill="#ffd54a"/>
    <rect x="-0.5" y="84" width="1" height="10" fill="#ffd54a"/>
    <circle cx="0" cy="83" r="2" fill="#fff" class="twinkle" style="animation-duration:1.2s"/>
    <!-- little stupas -->
    <path d="M-92,262 L-78,262 L-85,236 Z M78,262 L92,262 L85,236 Z" fill="url(#gold)"/>
  </g>

  <!-- ground -->
  <rect x="0" y="262" width="800" height="38" fill="#2a1a2e"/>

  <!-- clay oil lamps -->
  <g id="lamps">
    <g transform="translate(30,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347"/></g>
    <g transform="translate(90,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.1s"/></g>
    <g transform="translate(150,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.2s"/></g>
    <g transform="translate(210,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.05s"/></g>
    <g transform="translate(270,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.25s"/></g>
    <g transform="translate(330,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.15s"/></g>
    <g transform="translate(470,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.3s"/></g>
    <g transform="translate(530,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.12s"/></g>
    <g transform="translate(590,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.22s"/></g>
    <g transform="translate(650,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.08s"/></g>
    <g transform="translate(710,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.18s"/></g>
    <g transform="translate(770,272)"><ellipse rx="7" ry="3" fill="#8b4513"/><ellipse class="flame" cx="0" cy="-6" rx="2.2" ry="5" fill="#ffb347" style="animation-delay:-0.28s"/></g>
  </g>

  <text x="400" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f2c94c" letter-spacing="3">TAZAUNGDAING · FESTIVAL OF LIGHTS</text>
</svg>
